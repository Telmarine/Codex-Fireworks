plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = mod_version
group = 'com.tac5studios.codexfireworks'

base {
    archivesName = "codex_fireworks"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // Create (optional: Deployer copy recipe)
    maven {
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
    // CC: Tweaked (optional: peripherals), only published on Modrinth
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Optional mods: only compiled against, never needed at runtime.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly "maven.modrinth:cc-tweaked:${cc_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
